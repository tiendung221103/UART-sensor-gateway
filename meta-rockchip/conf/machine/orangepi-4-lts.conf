#@TYPE: Machine
#@NAME: Orange Pi 4 LTS
#@DESCRIPTION: Machine configuration for Orange Pi 4 LTS (RK3399, non-eMMC)

require conf/machine/include/rk3399.inc

KERNEL_DEVICETREE = "rockchip/rk3399-orangepi-4-lts.dtb"
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"

# UBOOT_MACHINE = "orangepi-rk3399_defconfig"
EXTRA_IMAGEDEPENDS += "virtual/bootloader"
PREFERRED_PROVIDER_virtual/kernel = "linux-orangepi"
PREFERRED_VERSION_linux-orangepi = "6.6"

KBUILD_DEFCONFIG = "defconfig"
ROCKCHIP_KERNEL_IMAGES = ""

KERNEL_IMAGETYPE = "Image"
KERNEL_IMAGETYPES = "Image"

PREFERRED_PROVIDER_virtual/bootloader = "u-boot-orangepi"
PREFERRED_VERSION_u-boot-orangepi = "2024.10"
PREFERRED_PROVIDER_linux-libc-headers = "linux-libc-headers"
PREFERRED_VERSION_linux-libc-headers = "6.6%"